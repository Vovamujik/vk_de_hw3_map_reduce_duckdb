# RustFS: один узел, 4 папки-диска (Erasure Coding 2+2), как в ДЗ №2.
# Основа — официальный пример rustfs/rustfs docker-compose-simple.yml.
services:
  volume-permission-helper:
    image: alpine:3.20
    volumes:
      - rustfs0:/data/rustfs0
      - rustfs1:/data/rustfs1
      - rustfs2:/data/rustfs2
      - rustfs3:/data/rustfs3
    command: sh -c "chown -R 10001:10001 /data"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: hw3-rustfs
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    ports:
      - "${RUSTFS_API_PORT:-9100}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9101}:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: warn
      # Все 4 named volume лежат на одном диске виртуалки Docker Desktop.
      # RustFS 1.0.1 без этого флага не стартует; он допустим только для учебного стенда.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs0:/data/rustfs0
      - rustfs1:/data/rustfs1
      - rustfs2:/data/rustfs2
      - rustfs3:/data/rustfs3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rustfs0:
  rustfs1:
  rustfs2:
  rustfs3:
